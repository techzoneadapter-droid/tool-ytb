name: StoryFlow CI

on:
  pull_request:
  push:
    branches:
      - chatgpt/storyflow-cloud-video-manager

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Install FFmpeg for media integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - run: npm test
      - run: npm run build
      - name: Python syntax
        run: |
          python -m py_compile workers/*.py
          python -m py_compile cloud/modal/*.py
